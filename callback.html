<!DOCTYPE html>
<html>
<head>
<title>LIFE.OS // Spotify Auth</title>
<style>
  body{background:#0a0612;color:#e8e4f0;font-family:'Courier New',monospace;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}
  .box{background:#120a22;border:1px solid #3a2566;padding:30px 40px;max-width:500px;text-align:center}
  .box::before{content:'';display:block;width:100%;height:2px;background:linear-gradient(90deg,#1DB954,transparent);margin-bottom:20px}
  h2{color:#1DB954;font-size:14px;letter-spacing:.3em;margin-bottom:12px}
  .code{background:#0a0612;border:1px solid #1DB954;color:#1DB954;padding:12px;font-size:13px;word-break:break-all;margin:14px 0;cursor:pointer;user-select:all}
  p{font-size:11px;color:#9890b0;line-height:1.6}
  .ok{color:#00e090;font-size:12px;margin-top:10px;display:none}
</style>
</head>
<body>
<div class="box">
  <h2>▣ LIFE.OS AUTH</h2>
  <p>Copy the code below, go back to your dashboard, and paste it:</p>
  <div class="code" id="code" onclick="copyCode()">Loading...</div>
  <p class="ok" id="ok">✓ Copied to clipboard!</p>
  <p style="margin-top:14px;color:#5c5478">You can close this tab after pasting.</p>
</div>
<script>
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code');
  const el = document.getElementById('code');
  if(code){
    el.textContent = code;
  } else {
    el.textContent = 'No code found. Try connecting again.';
    el.style.color = '#ff3060';
    el.style.borderColor = '#ff3060';
  }
  function copyCode(){
    if(code){
      navigator.clipboard.writeText(code);
      document.getElementById('ok').style.display='block';
    }
  }
</script>
</body>
</html>
