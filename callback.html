<!DOCTYPE html>
<html>
<head><title>LIFE.OS Auth</title></head>
<body>
<script>
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code');
  if (code && window.opener) {
    window.opener.postMessage({ spotifyCode: code }, '*');
    document.body.innerHTML = '<p style="font-family:monospace;color:green;padding:20px">✓ Authenticated. Closing...</p>';
    setTimeout(() => window.close(), 1500);
  }
</script>
</body>
</html>
