<!DOCTYPE html>
<html>
<head><title>LIFE.OS Auth</title></head>
<body>
<script>
  if(window.location.hash){
    const params=new URLSearchParams(window.location.hash.substring(1));
    const token=params.get('access_token');
    if(token&&window.opener){
      window.opener.postMessage({spotifyToken:token},'*');
      document.body.innerHTML='<p style="font-family:monospace;color:green">✓ Authenticated. You can close this tab.</p>';
      setTimeout(()=>window.close(),1500);
    }
  }
</script>
</body>
</html>
